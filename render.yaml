databases:
  - name: movie-db
    databaseName: movie_booking
    region: singapore
    plan: free

services:
  - type: web
    name: movie-booking
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: movie-db
          property: connectionString
